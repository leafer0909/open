<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レジ</title>
<!--
  LINE レジページ（LIFF）
  レジの開け・締めと、入金・出金（給料を含む）、その確認を1つのページで行います。
  開いたときにレジの状態（開け中／締め後）を表示し、状態に合わせてボタンの並びを変えます。
    開け中 … [出金][入金][レジ締め][確認]
    締め後 … [レジ開け][入金][出金][確認]

  ■ 設定 … このファイルは書き換えません。同じフォルダの config.js に GAS_URL と LIFF ID を書きます
-->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --green: #06c755; --text: #1f2328; --sub: #5b636b; --line: #e3e6e8;
    --bg: #f6f7f8; --card: #fff; --red: #d1242f; --red-bg: #fff1f0; --ok-bg: #effaf3;
    --warn: #9a5b00; --warn-bg: #fff6e5; --sel: #e7f8ee;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 16px 16px calc(120px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  .head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  h1 { font-size: 20px; margin: 0; }
  .badge { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 12px; }
  .badge.st-open { background: var(--sel); color: #0b6b31; }
  .badge.st-close, .badge.st-none { background: #e9ecef; color: var(--sub); }
  .muted { color: var(--sub); font-size: 14px; margin: 0 0 12px; }
  button { font-family: inherit; }
  button:disabled { opacity: .5; }

  /* タブ */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: #eceef0; border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .seg.two { grid-template-columns: 1fr 1fr; }
  .seg button { border: 0; background: none; padding: 10px 2px; font-size: 15px; white-space: nowrap; font-weight: 700; border-radius: 8px; color: var(--sub); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* 金種入力 */
  .table { background: var(--card); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 84px 1fr 104px; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row label { font-weight: 600; font-variant-numeric: tabular-nums; }
  .row input {
    width: 100%; font-size: 20px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    text-align: right; font-variant-numeric: tabular-nums; background: #fbfbfc;
  }
  .row input:focus { outline: 2px solid var(--green); border-color: var(--green); background: #fff; }
  .row .subt { text-align: right; color: var(--sub); font-variant-numeric: tabular-nums; font-size: 15px; }

  /* 入出金の入力 */
  .card { background: var(--card); border-radius: 14px; padding: 4px 14px; }
  .field { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .label { font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 15px; color: var(--text); }
  .chip.on { border-color: var(--green); background: var(--sel); font-weight: 700; }
  input[type=text], input[type=date], textarea {
    width: 100%; font-size: 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fbfbfc; color: var(--text); font-family: inherit;
  }
  input:focus, textarea:focus { outline: 2px solid var(--green); border-color: var(--green); background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  .amount { display: flex; align-items: center; gap: 8px; }
  .amount input { font-size: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .amount span { font-size: 17px; font-weight: 700; }
  .calc { margin-top: 8px; font-size: 14px; color: var(--sub); }
  .calc b { color: var(--text); }
  .calc .warn { color: var(--warn); display: block; margin-top: 2px; }
  .other { margin-top: 8px; }

  /* 確認画面（入出金） */
  .sheet { background: var(--card); border-radius: 14px; padding: 16px; }
  .sheet h2 { font-size: 17px; margin: 0 0 10px; }
  .sheet dl { display: grid; grid-template-columns: 6em 1fr; gap: 6px 10px; margin: 0; font-size: 15px; }
  .sheet dt { color: var(--sub); }
  .sheet dd { margin: 0; font-weight: 600; word-break: break-all; }
  .sheet .warn { grid-column: 1 / -1; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; }

  /* 締めの確認画面 */
  .cf { background: var(--card); border-radius: 12px; padding: 16px; margin-top: 14px; }
  .cf .line { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; font-variant-numeric: tabular-nums; }
  .cf .line > span { color: var(--sub); }
  .cf .line b { font-size: 20px; }
  .cf .diff { font-size: 15px; font-weight: 700; margin-left: 6px; }
  .cf .diff.minus { color: var(--red); }
  .cf .diff.plus { color: #b26a00; }
  .cf .gap { height: 10px; }
  .cf .note { color: var(--sub); font-size: 13px; margin-top: 6px; white-space: pre-line; }
  .cf .q { font-weight: 700; margin: 14px 0 10px; }
  .cf .btns { display: grid; gap: 10px; }
  .cf .btns button { border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; }
  .btn-yes { background: var(--green); color: #fff; }
  .btn-memo { background: #e8f0fe; color: #1a56c4; }
  .btn-cancel { background: #e9ecef; color: var(--text); }

  /* 一覧 */
  .list { background: var(--card); border-radius: 14px; padding: 4px 14px; }
  .group + .group { margin-top: 12px; }
  .glabel { font-size: 12.5px; color: var(--sub); font-weight: 700; margin: 0 2px 6px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .what { font-weight: 600; font-size: 15px; min-width: 0; }
  .item .amt { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; text-align: right; }
  .item .amt.in { color: #0b8a43; }
  .item .amt.out { color: var(--red); }
  .item .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--sub); }
  .item.regi .what { color: #0b6b31; }
  .item.regi.r-close .what { color: var(--text); }
  .item.regi { background: linear-gradient(90deg, var(--sel), transparent 70%); margin: 0 -14px; padding: 11px 14px; }
  .item.cancelled .what, .item.cancelled .amt { text-decoration: line-through; color: var(--sub); }
  .ctag { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 700; color: var(--red); background: var(--red-bg); border-radius: 4px; padding: 0 5px; }
  .cancelBtn { grid-column: 1 / -1; justify-self: end; margin-top: 6px; border: 1px solid var(--line); background: var(--card); color: var(--red); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
  .empty { padding: 18px 0; text-align: center; color: var(--sub); font-size: 14px; }
  .reload { width: 100%; margin-top: 12px; border: 0; border-radius: 12px; padding: 12px; font-size: 15px; background: #e9ecef; color: var(--text); }

  .msg { white-space: pre-line; line-height: 1.6; border-radius: 12px; padding: 14px; margin-top: 14px; background: var(--card); }
  .msg.ok { background: var(--ok-bg); color: #0b6b31; }
  .msg.ng { background: var(--red-bg); color: var(--red); }
  /* 完了画面 */
  .done { background: var(--card); border-radius: 16px; padding: 26px 18px 18px; text-align: center; }
  .done .mark { width: 56px; height: 56px; border-radius: 50%; background: var(--green); color: #fff; font-size: 30px; line-height: 56px; margin: 0 auto 10px; font-weight: 700; }
  .done h2 { font-size: 20px; margin: 0 0 12px; }
  .done .detail { white-space: pre-line; line-height: 1.7; text-align: left; background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
  .done .time { color: var(--sub); font-size: 13px; margin-top: 10px; }
  .done .btns { display: grid; gap: 10px; margin-top: 16px; }
  .done .again { border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; background: var(--green); color: #fff; }
  .close { width: 100%; margin-top: 14px; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; background: #e9ecef; color: var(--text); }

  /* 下に固定のボタン */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bar .inner { max-width: 440px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .total { flex: 1; }
  .total small { display: block; color: var(--sub); font-size: 12px; }
  .total b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .primary { flex: 2; border: 0; border-radius: 12px; padding: 14px 18px; font-size: 17px; font-weight: 700; background: var(--green); color: #fff; }
  .salesLine { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 15px; }
  .taskHead { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
  .taskHead b { font-size: 17px; }
  .taskHead span { color: var(--sub); font-size: 14px; font-weight: 600; }
  .task { border-radius: 0; display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 13px 0; font-size: 16px; color: var(--text); }
  .task:last-child { border-bottom: 0; }
  .task { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .task .box { width: 26px; height: 26px; border-radius: 7px; border: 2px solid #c4c9ce; display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 700; }
  .task.done .box { background: var(--green); border-color: var(--green); }
  .task.done .name { color: var(--sub); }
  .taskLine { display: block; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14.5px; color: var(--text); }
  .taskLine.warn { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .salesTotal { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; color: var(--sub); }
  .salesTotal b { font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
  .salesLine b { font-size: 17px; font-variant-numeric: tabular-nums; margin-left: 4px; }
  .salesLine button { border: 0; background: #e8f0fe; color: #1a56c4; border-radius: 8px; padding: 7px 12px; font-size: 14px; font-weight: 700; }
  .secondary { flex: 1; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; background: #e9ecef; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>レジ</h1>
    <span class="badge st-none" id="badge">読み込み中…</span>
  </div>
  <div class="seg" id="tabs"></div>

  <!-- 開け・締めの前：やることリスト -->
  <section id="vTasks" hidden>
    <div class="taskHead"><b id="taskTitle">開店作業</b><span id="taskCount"></span></div>
    <div class="list" id="taskList"></div>
    <p class="muted" style="margin-top:10px">済んだ作業をタップしてください。もう一度タップすると外せます。</p>
  </section>

  <!-- 締め：売上の入力（Squareと連動するまでの暫定） -->
  <section id="vSales" hidden>
    <button class="taskLine" data-tasks hidden></button>
    <div class="card">
      <div class="field">
        <div class="label">現金売上</div>
        <div class="amount">
          <input type="text" id="salesInput" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off" enterkeyhint="next">
          <span>円</span>
        </div>
      </div>
      <div class="field">
        <div class="label">キャッシュレス売上</div>
        <div class="amount">
          <input type="text" id="cashlessInput" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off" enterkeyhint="done">
          <span>円</span>
        </div>
      </div>
      <div class="field salesTotal"><span>総売上</span><b id="salesTotal">0円</b></div>
    </div>
    <p class="muted" style="margin-top:10px">Squareの端末に出ている今回の営業の売上を入力してください（なければ 0）。<br>次に、金種ごとの枚数を入力します。</p>
  </section>

  <!-- 開け・締め：金種入力 -->
  <section id="vCount" hidden>
    <button class="taskLine" data-tasks hidden></button>
    <div class="salesLine" id="salesLine" hidden>
      <span id="salesShow"></span>
      <button id="salesEdit">変更する</button>
    </div>
    <p class="muted">金種ごとの枚数を入力してください。</p>
    <div class="table" id="table"></div>
    <div id="reasonBox" hidden>
      <textarea id="reason" placeholder="合わない理由（例: 両替した、数え間違い など）" style="margin-top:10px"></textarea>
    </div>
    <div class="cf" id="cf" hidden>
      <div class="line"><span>レジ締め金額</span><b id="cfClose"></b></div>
      <div class="line"><span>予想レジ金額</span><b><span id="cfExpected"></span><span class="diff" id="cfDiff"></span></b></div>
      <div class="gap"></div>
      <div class="line"><span id="cfSquareLabel">現金売上（Square入力分）</span><b id="cfSquare"></b></div>
      <div class="line" id="cfCashlessLine" hidden><span>キャッシュレス（手入力）</span><b id="cfCashless"></b></div>
      <div class="line" id="cfTotalLine" hidden><span>総売上</span><b id="cfTotal"></b></div>
      <div class="note" id="cfNote"></div>
      <div class="q">これで良いですか？</div>
      <div id="cfMemoBox" hidden><textarea id="cfMemo" placeholder="メモ（例: 両替で1,000円札を補充した など）"></textarea></div>
      <div class="btns">
        <button class="btn-yes" id="cfYes">はい</button>
        <button class="btn-memo" id="cfMemoBtn">メモを加える</button>
        <button class="btn-cancel" id="cfCancel">キャンセル</button>
      </div>
    </div>
  </section>

  <!-- 入金・出金 -->
  <section id="vMoney" hidden>
    <div class="card" id="moneyForm">
      <div class="field" id="fCategory">
        <div class="label">科目</div>
        <div class="chips" id="categories"></div>
      </div>
      <div class="field" id="fWho" hidden>
        <div class="label">誰の給料ですか？</div>
        <div class="chips" id="staff"></div>
        <input type="text" id="otherName" class="other" placeholder="受け取る人の名前" hidden>
      </div>
      <div class="field" id="fDate" hidden>
        <div class="label">勤務日</div>
        <div class="chips" id="dateChips"></div>
        <input type="date" id="workDate" class="other" hidden>
      </div>
      <div class="field">
        <div class="label">金額</div>
        <div class="amount">
          <input type="text" id="amount" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off">
          <span>円</span>
        </div>
        <div class="calc" id="calc" hidden></div>
      </div>
      <div class="field">
        <div class="label">メモ（任意）</div>
        <textarea id="memo" placeholder="例: 野菜・果物、両替用 など"></textarea>
      </div>
    </div>
    <div class="sheet" id="moneyConfirm" hidden>
      <h2>この内容で記録しますか？</h2>
      <dl id="summary"></dl>
    </div>
  </section>

  <!-- 確認 -->
  <section id="vList" hidden>
    <div class="seg two">
      <button class="on" id="lNow">今の営業</button>
      <button id="lWeek">過去1週間</button>
    </div>
    <div id="list"></div>
    <button class="reload" id="reload">最新の状態にする</button>
  </section>

  <div id="msg" class="msg" hidden></div>

  <!-- 記録が終わったら -->
  <section class="done" id="done" hidden>
    <div class="mark">✓</div>
    <h2 id="doneTitle">記録しました</h2>
    <div class="detail" id="doneDetail"></div>
    <div class="time" id="doneTime"></div>
    <div class="btns">
      <button class="again" id="again">続けて記録する</button>
      <button class="close" id="close" style="margin-top:0">閉じる</button>
    </div>
  </section>
</div>

<!-- 下のボタン（開け・締め） -->
<div class="bar" id="barCount" hidden>
  <div class="inner">
    <div class="total"><small>合計</small><b id="total">0円</b></div>
    <button class="primary" id="countSubmit">送信する</button>
  </div>
</div>
<!-- 下のボタン（やることリスト） -->
<div class="bar" id="barTasks" hidden>
  <div class="inner">
    <button class="primary" id="tasksNext">次へ</button>
  </div>
</div>
<!-- 下のボタン（締め：現金売上） -->
<div class="bar" id="barSales" hidden>
  <div class="inner">
    <button class="primary" id="salesNext">次へ（枚数の入力）</button>
  </div>
</div>
<!-- 下のボタン（入金・出金） -->
<div class="bar" id="barMoney" hidden>
  <div class="inner">
    <button class="secondary" id="moneyBack" hidden>戻る</button>
    <button class="primary" id="moneyNext">確認する</button>
  </div>
</div>

<script>
  // ===== 設定（config.js から読む） =====
  const CONFIG = window.APP_CONFIG || {};
  const LIFF_ID = (CONFIG.LIFF || {}).regi || '';
  const GAS_URL = CONFIG.GAS_URL || '';
  // ================

  const DENOMS = [10000, 5000, 1000, 500, 100, 50, 10, 5, 1];
  const SALARY = '給料';
  const $ = (id) => document.getElementById(id);
  const yen = (n) => Number(n).toLocaleString('ja-JP') + '円';
  const hm = (min) => { const h = Math.floor(min / 60), m = min % 60; return (h ? h + '時間' : '') + (h ? String(m).padStart(2, '0') : m) + '分'; };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

  let conf = { state: 'none', categories: [], staff: [], wage: 1500, unitMin: 30, today: '' };
  let tab = '';                       // 開け／締め／入金／出金／確認
  const ms = { category: '', who: null, dateMode: '', date: '' };   // 入出金の入力状態
  let listMode = 'now', listData = null;
  const tasksPassed = {};             // { レジ開け: true } … 作業リストを見て「次へ」を押した
  let taskData = null;                // { kind, tasks: [{ task, done, by, time }] }
  const taskKind = () => (tab === 'レジ開け' ? '開店' : '閉店');
  let moneyReqId = '';                 // 入出金の受付番号（二重記録を防ぐ）
  let salesVal = null;                // レジ締めの前に入力した売上 { cash, cashless }（Square未設定の間だけ）
  const askSales = () => tab === 'レジ締め' && conf.askSales;

  async function api(payload) {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ idToken: liff.getIDToken() }, payload))
    });
    return res.json();
  }
  function showMsg(text, cls) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); m.hidden = false; m.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  function hideMsg() { $('msg').hidden = true; }

  // ===== 状態とタブ =====
  function renderHead() {
    const b = $('badge');
    b.className = 'badge st-' + conf.state;
    b.textContent = conf.state === 'open' ? 'レジ開け中' : conf.state === 'close' ? 'レジ締め後' : 'レジの記録なし';
    const tabs = conf.state === 'open' ? ['出金', '入金', 'レジ締め', '確認'] : ['レジ開け', '入金', '出金', '確認'];
    $('tabs').replaceChildren(...tabs.map((t) => {
      const btn = el('button', t === tab ? 'on' : '', t);
      btn.addEventListener('click', () => selectTab(t));
      return btn;
    }));
  }

  function selectTab(t) {
    tab = t;
    hideMsg();
    renderHead();
    const isRegi = t === 'レジ開け' || t === 'レジ締め';
    const needTasks = isRegi && !tasksPassed[t];
    $('vTasks').hidden = !needTasks; $('barTasks').hidden = !needTasks;
    if (needTasks) loadTasks();
    renderTaskLines();
    const isCount = isRegi && !needTasks, isMoney = t === '入金' || t === '出金';
    if (needTasks) { ['vSales', 'barSales', 'vCount', 'barCount', 'vMoney', 'barMoney', 'vList'].forEach((id) => ($(id).hidden = true)); return; }
    const needSales = isCount && askSales() && salesVal === null;
    $('vSales').hidden = !needSales; $('barSales').hidden = !needSales;
    $('vCount').hidden = !isCount || needSales; $('barCount').hidden = !isCount || needSales;
    $('salesLine').hidden = !(isCount && askSales() && salesVal !== null);
    if (salesVal !== null) $('salesShow').innerHTML = '現金 <b>' + yen(salesVal.cash) + '</b><br>キャッシュレス <b>' + yen(salesVal.cashless) + '</b>';
    if (needSales) { $('salesInput').value = ''; $('cashlessInput').value = ''; salesTotal(); setTimeout(() => $('salesInput').focus(), 50); }
    $('vMoney').hidden = !isMoney; $('barMoney').hidden = !isMoney;
    $('vList').hidden = t !== '確認';
    if (isCount) { $('cf').hidden = true; $('reasonBox').hidden = true; setCountInputs(true); $('countSubmit').textContent = '送信する'; }
    if (isMoney) { toMoneyForm(); renderMoney(); }
    if (t === '確認') loadList();
  }

  // ===== やることリスト =====
  async function loadTasks() {
    const kind = taskKind();
    $('taskTitle').textContent = kind + '作業';
    $('tasksNext').textContent = tab === 'レジ開け' ? '次へ（金種の入力）' : askSales() ? '次へ（売上の入力）' : '次へ（金種の入力）';
    if (!taskData || taskData.kind !== kind) { $('taskList').replaceChildren(el('div', 'empty', '読み込み中…')); $('taskCount').textContent = ''; }
    else renderTasks();
    try {
      const r = await api({ action: 'task_status', kind });
      if (!r.ok) { showMsg(r.message, 'ng'); return; }
      taskData = r;
      if (!r.tasks.length && tab && taskKind() === kind && !tasksPassed[tab]) { tasksPassed[tab] = true; selectTab(tab); return; }   // 作業が1つもなければ飛ばす
      renderTasks();
    } catch (e) { showMsg('作業リストを読み込めませんでした。「次へ」で先に進めます。', 'ng'); }
  }
  function renderTasks() {
    if (!taskData) return;
    const done = taskData.tasks.filter((x) => x.done).length;
    $('taskCount').textContent = done + '/' + taskData.tasks.length + ' 完了';
    $('taskList').replaceChildren(...taskData.tasks.map((x) => {
      const b = el('button', 'task' + (x.done ? ' done' : ''));
      b.append(el('span', 'box', x.done ? '✓' : ''), el('span', 'name', x.task));
      b.addEventListener('click', () => toggleTask(x, b));
      return b;
    }));
    renderTaskLines();
  }
  // タップしたらすぐ見た目を変え、記録は裏で順番に送る（返事を待たない）
  let taskQueue = Promise.resolve();
  function paintTask(x, b) {
    b.classList.toggle('done', x.done);
    b.querySelector('.box').textContent = x.done ? '✓' : '';
    $('taskCount').textContent = taskData.tasks.filter((t) => t.done).length + '/' + taskData.tasks.length + ' 完了';
    renderTaskLines();
  }
  function toggleTask(x, b) {
    x.done = !x.done;
    paintTask(x, b);
    const kind = taskData.kind, done = x.done;
    taskQueue = taskQueue.then(async () => {
      try {
        const r = await api({ action: 'task_toggle', kind, task: x.task, done });
        if (!r.ok) throw new Error(r.message);
      } catch (e) {
        if (x.done === done) { x.done = !done; paintTask(x, b); }   // その後に押し直していなければ元に戻す
        showMsg('「' + x.task + '」を記録できませんでした。もう一度タップしてください。', 'ng');
      }
    });
  }
  function leftTasks() { return taskData && taskData.kind === taskKind() ? taskData.tasks.filter((x) => !x.done).map((x) => x.task) : []; }
  // 売上・金種の画面の上に「開店作業 4/5 完了」を出す（タップでリストに戻る）
  function renderTaskLines() {
    document.querySelectorAll('[data-tasks]').forEach((b) => {
      const show = taskData && taskData.kind === taskKind() && taskData.tasks.length && tasksPassed[tab];
      b.hidden = !show;
      if (!show) return;
      const left = leftTasks();
      b.className = 'taskLine' + (left.length ? ' warn' : '');
      b.textContent = taskData.kind + '作業 ' + (taskData.tasks.length - left.length) + '/' + taskData.tasks.length + ' 完了' + (left.length ? '（未完了あり）' : ' ✓');
    });
  }
  function tasksNext() {
    const left = leftTasks();
    if (left.length && !confirm('未完了の作業が' + left.length + 'つあります：\n' + left.join('、') + '\n\nこのまま進みますか？')) return;
    tasksPassed[tab] = true;
    selectTab(tab);
    window.scrollTo(0, 0);
  }

  // ===== 開け・締め =====
  function buildTable() {
    $('table').innerHTML = DENOMS.map((d, i) => `
      <div class="row">
        <label for="c${i}">${d.toLocaleString('ja-JP')}円</label>
        <input id="c${i}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
               enterkeyhint="${i < DENOMS.length - 1 ? 'next' : 'done'}" placeholder="0">
        <div class="subt" id="s${i}">0円</div>
      </div>`).join('');
    DENOMS.forEach((d, i) => {
      const inp = $('c' + i);
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '');
        recalc();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); if (i < DENOMS.length - 1) $('c' + (i + 1)).focus(); else inp.blur(); }
      });
    });
  }
  const counts = () => DENOMS.map((_, i) => Number($('c' + i).value) || 0);
  function recalc() {
    let t = 0;
    counts().forEach((n, i) => { const s = DENOMS[i] * n; t += s; $('s' + i).textContent = yen(s); });
    $('total').textContent = yen(t);
  }
  const setCountInputs = (on) => document.querySelectorAll('#table input').forEach((x) => (x.disabled = !on));
  const regiKind = () => tab;   // タブ名がそのまま区分（レジ開け／レジ締め）

  async function countSubmit() {
    await taskQueue;   // チェックの記録が送り終わってから、開け・締めを記録する
    const c = counts();
    if (c.every((n) => n === 0)) { showMsg('枚数を入力してください。', 'ng'); return; }
    const needReason = !$('reasonBox').hidden;
    const reason = $('reason').value.trim();
    if (needReason && !reason) { showMsg('合わない理由を入力してください。', 'ng'); $('reason').focus(); return; }
    $('countSubmit').disabled = true;
    $('countSubmit').textContent = tab === 'レジ締め' ? 'Squareの売上を確認中…' : '送信中…';
    try {
      const d = await api({ action: 'regi_submit', kind: regiKind(), counts: c, reason: needReason ? reason : '', manualSales: askSales() ? salesVal.cash : undefined, manualCashless: askSales() ? salesVal.cashless : undefined });
      if (d.ok && d.preview) { showCloseConfirm(d); }
      else if (d.ok) { finished(d.message, regiKind() + 'を記録しました（' + yen(c.reduce((s, n, i) => s + n * DENOMS[i], 0)) + '）', regiKind() + 'を記録しました'); }
      else {
        showMsg(d.message, 'ng');
        if (d.needReason) { $('reasonBox').hidden = false; $('countSubmit').textContent = '理由を付けて記録'; }
        else if (d.recount) { $('countSubmit').textContent = '数え直して送信'; }
        else { $('countSubmit').textContent = '送信する'; }
      }
    } catch (e) {
      showMsg('通信に失敗しました。もう一度お試しください。', 'ng');
      $('countSubmit').textContent = '送信する';
    } finally {
      $('countSubmit').disabled = false;
    }
  }

  function showCloseConfirm(d) {
    hideMsg();
    $('barCount').hidden = true;
    setCountInputs(false);
    $('cfClose').textContent = yen(d.closeTotal);
    if (d.expected !== null && d.expected !== undefined) {
      $('cfExpected').textContent = yen(d.expected);
      $('cfDiff').textContent = '（' + (d.diff > 0 ? '+' : d.diff < 0 ? '−' : '±') + Math.abs(d.diff).toLocaleString('ja-JP') + '）';
      $('cfDiff').className = 'diff ' + (d.diff < 0 ? 'minus' : d.diff > 0 ? 'plus' : '');
    } else { $('cfExpected').textContent = '—'; $('cfDiff').textContent = ''; }
    $('cfSquare').textContent = (d.square !== null && d.square !== undefined) ? yen(d.square) : '—';
    $('cfSquareLabel').textContent = d.manual ? '現金売上（手入力）' : '現金売上（Square入力分）';
    const hasCl = d.manual && d.cashless !== null && d.cashless !== undefined;
    $('cfCashlessLine').hidden = !hasCl; $('cfTotalLine').hidden = !hasCl;
    if (hasCl) { $('cfCashless').textContent = yen(d.cashless); $('cfTotal').textContent = yen((d.square || 0) + d.cashless); }
    $('cfNote').textContent = d.note || (d.squareError ? 'Squareの売上を取得できませんでした。このまま記録して、あとで取り直すことができます。' : '');
    $('cfMemoBox').hidden = true; $('cfMemoBtn').hidden = false; $('cfYes').textContent = 'はい';
    $('cf').hidden = false;
    $('cf').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function confirmClose() {
    const memoOpen = !$('cfMemoBox').hidden;
    const memo = memoOpen ? $('cfMemo').value.trim() : '';
    if (memoOpen && !memo) { $('cfMemo').focus(); return; }
    ['cfYes', 'cfMemoBtn', 'cfCancel'].forEach((id) => ($(id).disabled = true));
    $('cfYes').textContent = '記録中…';
    try {
      const c = counts();
      const d = await api({ action: 'regi_submit', kind: 'レジ締め', counts: c, confirm: true, memo: memo, manualSales: askSales() ? salesVal.cash : undefined, manualCashless: askSales() ? salesVal.cashless : undefined });
      if (d.ok) finished(d.message, 'レジ締めを記録しました（' + yen(c.reduce((s, n, i) => s + n * DENOMS[i], 0)) + '）', 'レジ締めを記録しました');
      else { showMsg(d.message, 'ng'); $('cfYes').textContent = memoOpen ? 'メモを付けて記録' : 'はい'; }
    } catch (e) {
      showMsg('通信に失敗しました。もう一度お試しください。', 'ng');
      $('cfYes').textContent = memoOpen ? 'メモを付けて記録' : 'はい';
    } finally {
      ['cfYes', 'cfMemoBtn', 'cfCancel'].forEach((id) => ($(id).disabled = false));
    }
  }

  // ===== 入金・出金 =====
  function chip(label, on, onClick) { const b = el('button', 'chip' + (on ? ' on' : ''), label); b.addEventListener('click', onClick); return b; }
  function amountValue() { return Number($('amount').value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^\d]/g, '')) || 0; }

  function renderMoney() {
    const isOut = tab === '出金';
    const isSalary = isOut && ms.category === SALARY;
    $('fCategory').hidden = !isOut;
    $('fWho').hidden = !isSalary;
    $('fDate').hidden = !isSalary;
    $('categories').replaceChildren(...conf.categories.map((c) => chip(c, ms.category === c, () => { ms.category = c; renderMoney(); })));
    $('staff').replaceChildren(...conf.staff.map((p, i) => chip(p.label, ms.who === i, () => { ms.who = i; ms.date = ''; ms.dateMode = ''; renderMoney(); }))
      .concat([chip('その他', ms.who === 'other', () => { ms.who = 'other'; ms.date = ''; ms.dateMode = 'pick'; renderMoney(); })]));
    $('otherName').hidden = ms.who !== 'other';
    const person = typeof ms.who === 'number' ? conf.staff[ms.who] : null;
    if (ms.who !== null && !(person && person.checkin) && !ms.dateMode) ms.dateMode = 'pick';
    const chips = [];
    if (person && person.checkin) {
      const d = person.checkin;
      chips.push(chip('今日（' + Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) + '）', ms.dateMode === 'today', () => { ms.dateMode = 'today'; ms.date = d; renderMoney(); }));
    }
    chips.push(chip('日付を選ぶ', ms.dateMode === 'pick', () => { ms.dateMode = 'pick'; ms.date = ''; renderMoney(); setTimeout(() => $('workDate').focus(), 50); }));
    $('dateChips').replaceChildren(...chips);
    $('workDate').hidden = ms.dateMode !== 'pick';
    const a = amountValue();
    if (isSalary && a > 0) {
      const unitYen = conf.wage * conf.unitMin / 60;
      $('calc').innerHTML = '労働時間 <b>' + hm(Math.round(a / conf.wage * 60)) + '</b>（' + yen(a) + ' ÷ 時給' + yen(conf.wage) + '）' +
        (a % unitYen ? '<span class="warn">※ ' + conf.unitMin + '分単位の金額ではありません</span>' : '');
      $('calc').hidden = false;
    } else { $('calc').hidden = true; }
  }

  function collectMoney() {
    const isOut = tab === '出金';
    const isSalary = isOut && ms.category === SALARY;
    const d = { kind: tab, category: isOut ? ms.category : '', amount: amountValue(), memo: $('memo').value.trim() };
    if (isOut && !ms.category) return { error: '科目を選んでください。' };
    if (!d.amount) return { error: '金額を入力してください。' };
    if (isSalary) {
      if (ms.who === null) return { error: '誰の給料かを選んでください。' };
      if (ms.who === 'other') { d.recipientName = $('otherName').value.trim(); d.recipientId = ''; if (!d.recipientName) return { error: '受け取る人の名前を入力してください。' }; }
      else { d.recipientName = conf.staff[ms.who].name; d.recipientId = conf.staff[ms.who].userId; }
      d.workDate = ms.dateMode === 'today' ? ms.date : ($('workDate').value || '').replace(/-/g, '/');
      if (!d.workDate) return { error: '勤務日を選んでください。' };
      if (d.workDate > conf.today) return { error: '勤務日に未来の日付は選べません。' };
    }
    return d;
  }

  function toMoneyConfirm() {
    const d = collectMoney();
    if (d.error) { showMsg(d.error, 'ng'); return; }
    hideMsg();
    const rows = [['区分', d.kind]];
    if (d.category) rows.push(['科目', d.category]);
    if (d.recipientName) rows.push(['受取人', d.recipientName]);
    rows.push(['金額', yen(d.amount)]);
    if (d.workDate) { rows.push(['勤務日', d.workDate]); rows.push(['労働時間', hm(Math.round(d.amount / conf.wage * 60)) + '（時給' + yen(conf.wage) + '）']); }
    rows.push(['メモ', d.memo || 'なし']);
    const dl = $('summary'); dl.innerHTML = '';
    rows.forEach(([k, v]) => dl.append(el('dt', '', k), el('dd', '', v)));
    if (d.workDate && d.amount % (conf.wage * conf.unitMin / 60)) dl.append(el('div', 'warn', '※ ' + conf.unitMin + '分単位の金額ではありません'));
    $('moneyForm').hidden = true; $('moneyConfirm').hidden = false; $('tabs').hidden = true;
    $('moneyBack').hidden = false; $('moneyNext').textContent = '記録する';
    moneyReqId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);   // 押し直しても同じ番号で送る
    window.scrollTo(0, 0);
  }
  function toMoneyForm() {
    $('moneyForm').hidden = false; $('moneyConfirm').hidden = true; $('tabs').hidden = false;
    $('moneyBack').hidden = true; $('moneyNext').textContent = '確認する';
  }
  async function moneySubmit() {
    const d = collectMoney();
    if (d.error) { toMoneyForm(); showMsg(d.error, 'ng'); return; }
    $('moneyNext').disabled = true; $('moneyBack').disabled = true; $('moneyNext').textContent = '記録中…';
    try {
      const r = await api(Object.assign({ action: 'money_submit', requestId: moneyReqId }, d));
      if (!r.ok) { showMsg(r.message, 'ng'); $('moneyNext').textContent = '記録する'; return; }
      // r.duplicate … 前回の送信がすでに記録されていた（トークにも重ねて送らない）
      finished(r.message, r.duplicate ? '' : (r.chat || r.message), r.duplicate ? '記録済みです' : d.kind + 'を記録しました');
    } catch (e) {
      showMsg('通信に失敗しました。もう一度お試しください。', 'ng'); $('moneyNext').textContent = '記録する';
    } finally { $('moneyNext').disabled = false; $('moneyBack').disabled = false; }
  }

  // ===== 確認（今の営業／過去1週間） =====
  function itemRow(it, canCancel) {
    const isRegi = it.type === 'open' || it.type === 'close';
    const row = el('div', 'item' + (isRegi ? ' regi r-' + it.type : '') + (it.cancelled ? ' cancelled' : ''));
    row.append(el('div', 'what', it.label));
    const amt = el('div', 'amt' + (it.type === 'in' ? ' in' : it.type === 'out' ? ' out' : ''));
    amt.textContent = it.type === 'in' ? '+' + it.amount.toLocaleString('ja-JP') : it.type === 'out' ? '−' + it.amount.toLocaleString('ja-JP') : yen(it.amount);
    const meta = el('div', 'meta', it.time + '・' + it.name + (it.note ? '・' + it.note : ''));
    if (it.cancelled) meta.append(el('span', 'ctag', '取消' + (it.cancelBy ? '（' + it.cancelBy + '）' : '')));
    row.append(amt, meta);
    if (canCancel && it.cancellable) {
      const b = el('button', 'cancelBtn', '取り消す');
      b.addEventListener('click', () => cancelMoney(it, b));
      row.append(b);
    }
    return row;
  }
  async function cancelMoney(it, btn) {
    if (!confirm('「' + it.label + ' ' + yen(it.amount) + '」（' + it.time + '・' + it.name + '）を取り消しますか？')) return;
    btn.disabled = true; btn.textContent = '取消中…';
    try {
      const r = await api({ action: 'money_cancel', id: it.id });
      if (!r.ok) { showMsg(r.message, 'ng'); btn.disabled = false; btn.textContent = '取り消す'; return; }
      listData = r; renderList(); showMsg(r.message, 'ok');
      if (liff.isInClient() && r.chat) { try { await liff.sendMessages([{ type: 'text', text: r.chat }]); } catch (e) { console.warn(e); } }
    } catch (e) { showMsg('通信に失敗しました。最新の状態にして確かめてください。', 'ng'); btn.disabled = false; btn.textContent = '取り消す'; }
  }
  function renderList() {
    $('lNow').classList.toggle('on', listMode === 'now');
    $('lWeek').classList.toggle('on', listMode === 'week');
    const box = $('list'); box.innerHTML = '';
    const emptyCard = (text) => { const c = el('div', 'list'); c.append(el('div', 'empty', text)); box.append(c); };
    if (!listData) { emptyCard('読み込み中…'); return; }
    if (listMode === 'now') {
      const card = el('div', 'list');
      if (!listData.current.length) card.append(el('div', 'empty', 'レジの記録がまだありません。'));
      listData.current.forEach((it) => card.append(itemRow(it, true)));
      if (listData.current.length === 1) card.append(el('div', 'empty', (listData.current[0].type === 'open' ? '開け' : '締め') + 'のあとの入出金はまだありません。'));
      box.append(card);
    } else {
      if (!listData.week.length) { emptyCard('過去1週間の記録はありません。'); return; }
      listData.week.forEach((g) => {
        const wrap = el('div', 'group');
        wrap.append(el('div', 'glabel', g[0].time.split(' ')[0] + (g[0].type === 'open' ? ' の営業' : ' の記録')));
        const card = el('div', 'list');
        g.forEach((it) => card.append(itemRow(it)));
        wrap.append(card); box.append(wrap);
      });
    }
  }
  async function loadList() {
    listData = null; renderList();
    try {
      const r = await api({ action: 'register_list' });
      if (!r.ok) { $('list').innerHTML = ''; $('list').append(el('div', 'empty', r.message)); return; }
      listData = r; renderList();
    } catch (e) { $('list').innerHTML = ''; $('list').append(el('div', 'empty', '読み込みに失敗しました。')); }
  }

  // ===== 記録が終わったら =====
  async function finished(message, chatText, title) {
    hideMsg();
    ['vCount', 'vMoney', 'vList', 'barCount', 'barMoney', 'tabs'].forEach((id) => ($(id).hidden = true));
    $('doneTitle').textContent = title || '記録しました';
    // レジ開け・締めを記録したら、右上の状態もすぐ切り替える
    if (/^レジ開け/.test(title)) conf.state = 'open';
    if (/^レジ締め/.test(title)) conf.state = 'close';
    renderHead();
    $('doneDetail').textContent = message;
    const now = new Date();
    $('doneTime').textContent = (now.getMonth() + 1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' に記録';
    $('done').hidden = false;
    window.scrollTo(0, 0);
    // トークにも記録を残す（レジ用LIFFに chat_message.write の権限が必要）
    if (liff.isInClient() && chatText) {
      try { await liff.sendMessages([{ type: 'text', text: chatText }]); } catch (e) { console.warn(e); }
    }
  }

  // 「続けて記録する」：入力を空にして、最新の状態で最初の画面に戻る
  async function again() {
    $('done').hidden = true;
    DENOMS.forEach((_, i) => { $('c' + i).value = ''; });
    recalc(); $('reason').value = ''; $('cfMemo').value = '';
    $('amount').value = ''; $('memo').value = ''; $('otherName').value = ''; $('workDate').value = '';
    Object.assign(ms, { category: '', who: null, dateMode: '', date: '' });
    salesVal = null;
    Object.keys(tasksPassed).forEach((k) => delete tasksPassed[k]); taskData = null;
    $('tabs').hidden = false;
    try {
      const r = await api({ action: 'register_status' });
      if (r.ok) conf = r;
    } catch (e) { /* 状態が取れなければ前の状態のまま */ }
    selectTab(conf.state === 'open' ? '出金' : 'レジ開け');
  }

  // ===== ボタン =====
  const digits = (id) => $(id).value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^\d]/g, '');
  function salesTotal() { $('salesTotal').textContent = yen((Number(digits('salesInput')) || 0) + (Number(digits('cashlessInput')) || 0)); }
  ['salesInput', 'cashlessInput'].forEach((id) => {
    $(id).addEventListener('input', () => { hideMsg(); const v = digits(id); $(id).value = v ? Number(v).toLocaleString('ja-JP') : ''; salesTotal(); });
  });
  $('salesInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('cashlessInput').focus(); } });
  $('cashlessInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('salesNext').click(); } });
  $('salesNext').addEventListener('click', () => {
    const c = digits('salesInput'), cl = digits('cashlessInput');
    if (c === '') { showMsg('現金売上を入力してください（なければ 0）。', 'ng'); $('salesInput').focus(); return; }
    if (cl === '') { showMsg('キャッシュレス売上を入力してください（なければ 0）。', 'ng'); $('cashlessInput').focus(); return; }
    salesVal = { cash: Number(c), cashless: Number(cl) };
    selectTab('レジ締め');
    window.scrollTo(0, 0);
  });
  $('salesEdit').addEventListener('click', () => {
    const v = salesVal; salesVal = null; selectTab('レジ締め');
    $('salesInput').value = v.cash.toLocaleString('ja-JP'); $('cashlessInput').value = v.cashless.toLocaleString('ja-JP'); salesTotal();
  });
  $('countSubmit').addEventListener('click', countSubmit);
  $('tasksNext').addEventListener('click', tasksNext);
  document.querySelectorAll('[data-tasks]').forEach((b) => b.addEventListener('click', () => { tasksPassed[tab] = false; selectTab(tab); window.scrollTo(0, 0); }));
  $('cfYes').addEventListener('click', confirmClose);
  $('cfMemoBtn').addEventListener('click', () => { $('cfMemoBox').hidden = false; $('cfMemoBtn').hidden = true; $('cfYes').textContent = 'メモを付けて記録'; $('cfMemo').focus(); });
  $('cfCancel').addEventListener('click', () => { $('cf').hidden = true; $('barCount').hidden = false; setCountInputs(true); $('countSubmit').textContent = '送信する'; window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('amount').addEventListener('input', () => { const v = amountValue(); $('amount').value = v ? v.toLocaleString('ja-JP') : ''; renderMoney(); });
  $('moneyNext').addEventListener('click', () => ($('moneyConfirm').hidden ? toMoneyConfirm() : moneySubmit()));
  $('moneyBack').addEventListener('click', toMoneyForm);
  $('lNow').addEventListener('click', () => { listMode = 'now'; renderList(); });
  $('lWeek').addEventListener('click', () => { listMode = 'week'; renderList(); });
  $('reload').addEventListener('click', loadList);
  $('again').addEventListener('click', again);
  $('close').addEventListener('click', () => { if (liff.isInClient()) liff.closeWindow(); else window.close(); });

  async function main() {
    buildTable();
    try {
      if (!/^\d+-\w+$/.test(LIFF_ID) || !/^https:\/\//.test(GAS_URL)) throw new Error('config');
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      const r = await api({ action: 'register_status' });
      if (!r.ok) { $('badge').textContent = ''; showMsg(r.message, 'ng'); return; }
      conf = r;
      $('workDate').max = r.today.replace(/\//g, '-');
      selectTab(conf.state === 'open' ? '出金' : 'レジ開け');
    } catch (e) {
      $('badge').textContent = '';
      showMsg(e && e.message === 'config'
        ? 'config.js が読み込めないか、設定が入っていません。\n管理者に連絡してください。'
        : 'ページの準備に失敗しました。\nLINEのトーク画面から開き直してください。', 'ng');
    }
  }
  main();
</script>
</body>
</html>
