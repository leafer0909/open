<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勤怠</title>
<!--
  LINE 勤怠ページ（LIFF）
    出勤 … シフト表に今日の予定があれば表示して［はい］で出勤。［いいえ］や予定がない日は A/B/C を選ぶ
           （スマホのGPSで店舗にいるか確認。退勤の記録はなし：シフトの終了＋残業で勤務が終わる）
    残業 … いちばん新しい出勤に、30分単位で残業を付ける（次に出勤するまで直せる）
    確認 … 14日前までの全員の勤務（シフト・残業・給料の支払済／未払い）

  ■ 設定 … このファイルは書き換えません。同じフォルダの config.js に GAS_URL と LIFF ID を書きます
-->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<style>
  :root { --green: #06c755; --text: #1f2328; --sub: #5b636b; --bg: #f6f7f8; --card: #fff; --red: #d1242f; --line: #d0d7de; --sel: #e7f8ee; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--card); border-radius: 16px;
    padding: 28px 22px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .clock { font-size: 40px; font-weight: 700; letter-spacing: 1px; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .date { color: var(--sub); margin-bottom: 18px; }
  .state { border-radius: 12px; background: var(--bg); padding: 12px; margin-bottom: 16px; line-height: 1.6; }
  .state b { font-size: 17px; }
  .state small { display: block; color: var(--sub); font-size: 13px; }
  .state.working { background: var(--sel); }
  .status { min-height: 24px; white-space: pre-line; line-height: 1.6; margin: 12px 0; }
  .status.ok { color: #0b8a43; font-weight: 700; }
  .status.ng { color: var(--red); }
  button {
    width: 100%; border: 0; border-radius: 12px; padding: 16px; font-size: 18px; font-weight: 700;
    background: var(--green); color: #fff; cursor: pointer; font-family: inherit;
  }
  button.sub { background: #e9ecef; color: var(--text); margin-top: 10px; font-weight: 500; font-size: 16px; }
  button.link { background: none; color: var(--sub); font-size: 14px; font-weight: 500; padding: 10px; margin-top: 6px; text-decoration: underline; }
  button:disabled { opacity: .5; }
  .label { text-align: left; font-size: 13px; color: var(--sub); font-weight: 600; margin: 4px 0 8px; }
  .chips { display: flex; gap: 8px; margin-bottom: 10px; }
  .chip { width: auto; flex: 1; border: 1.5px solid var(--line); background: #fff; color: var(--text); font-size: 16px; font-weight: 500; padding: 10px; }
  .chip.on { border-color: var(--green); background: var(--sel); font-weight: 700; }
  input[type=datetime-local] { width: 100%; font-size: 17px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; font-family: inherit; }
  .preview { font-size: 15px; margin: 4px 0 14px; color: var(--sub); }
  .preview b { color: var(--text); font-size: 18px; }
  .choices { display: grid; gap: 10px; margin: 4px 0; }
  .choices button { background: #fff; color: var(--text); border: 1.5px solid var(--line); font-size: 16px; padding: 14px; text-align: left; }
  .choices button small { display: block; font-size: 12.5px; color: var(--sub); font-weight: 400; margin-top: 2px; }
  .spinner {
    width: 28px; height: 28px; margin: 8px auto; border: 3px solid #dfe3e6; border-top-color: var(--green);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 記録／確認の切り替え */
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 10px; padding: 3px; margin: 4px 0 14px; }
  .seg button { background: none; color: var(--sub); font-size: 15px; padding: 9px; border-radius: 8px; font-weight: 700; }
  .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg.small button { font-size: 14px; padding: 7px; }

  /* 確認の一覧 */
  .list { text-align: left; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 2px; border-bottom: 1px solid #eceff1; }
  .row:last-child { border-bottom: 0; }
  .row .who { font-weight: 700; font-size: 15px; min-width: 0; }
  .row .times { grid-column: 1 / -1; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .tag { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; align-self: start; }
  .tag.work { background: var(--sel); color: #0b6b31; }
  .tag.done { background: #eef0f2; color: var(--sub); }
  .tag.paid { background: #eef0f2; color: var(--sub); }
  .tag.diff { background: #fff4e0; color: #9a5b00; }
  .tag.unpaid { background: #fdecea; color: var(--red); }
  .tag.noout { background: #fff4e0; color: #9a5b00; }
  .empty { padding: 18px 0; text-align: center; color: var(--sub); font-size: 14px; }

  .seg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--bg); border-radius: 10px; padding: 3px; margin: 4px 0 14px; }
  .seg3 button { background: none; color: var(--sub); font-size: 15px; padding: 9px; border-radius: 8px; font-weight: 700; }
  .seg3 button.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .shift { border-radius: 14px; background: var(--sel); padding: 16px; margin: 6px 0 14px; text-align: left; }
  .shift .big { font-size: 30px; font-weight: 800; display: flex; align-items: baseline; gap: 10px; }
  .shift .big span { font-size: 20px; font-weight: 700; }
  .shift dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0 0; font-size: 15px; }
  .shift dt { color: var(--sub); } .shift dd { margin: 0; font-weight: 700; }
  .q { font-size: 17px; font-weight: 700; margin: 6px 0 12px; }
  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .yn .no { background: #fff; color: var(--text); border: 1.5px solid var(--line); }
  .pick { display: grid; gap: 10px; text-align: left; margin-bottom: 12px; }
  .pick button { background: #fff; color: var(--text); border: 1.5px solid var(--line); font-size: 16px; padding: 12px 14px; text-align: left;
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; font-weight: 700; }
  .pick button.on { border-color: var(--green); background: var(--sel); }
  .pick b.k { font-size: 24px; } .pick small { color: var(--sub); font-weight: 500; font-size: 13px; display: block; }
  .target { background: var(--bg); border-radius: 12px; padding: 12px; text-align: left; font-size: 14px; color: var(--sub); margin-bottom: 14px; line-height: 1.6; }
  .target b { color: var(--text); font-size: 16px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 8px; }
  .stepper button { width: 56px; height: 56px; padding: 0; border-radius: 14px; background: #fff; color: var(--text); border: 1.5px solid var(--line); font-size: 26px; }
  .stepper .v { font-size: 32px; font-weight: 800; min-width: 160px; }
  .preview2 { font-size: 15px; color: var(--sub); margin-bottom: 14px; } .preview2 b { color: var(--text); }
  .note { font-size: 12.5px; color: var(--sub); margin-top: 8px; text-align: left; }
  .day { font-size: 13px; font-weight: 700; color: var(--sub); margin: 12px 2px 4px; text-align: left; }
  .r { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 9px 2px; border-bottom: 1px solid #eceff1; text-align: left; align-items: center; }
  .r .nm { font-weight: 700; font-size: 15px; min-width: 0; }
  .r .sh { font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 7px; background: #eef0f2; color: var(--sub); }
  .r .sh.A { background: #e7f8ee; color: #0b6b31; } .r .sh.B { background: #e8f0fe; color: #1a56c4; } .r .sh.C { background: #fff1d6; color: #8a5300; }
  .r .det { grid-column: 2 / -1; font-size: 12.5px; color: var(--sub); }
  .tag.unknown { background: #eef0f2; color: var(--sub); }
  .ver { color: #b5bbc1; font-size: 11px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>勤怠</h1>
    <div class="seg3" id="tabs">
      <button class="on" data-tab="in">出勤</button>
      <button data-tab="ot">残業</button>
      <button data-tab="list">確認</button>
    </div>

    <!-- 出勤 -->
    <div id="vIn">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="spinner" id="spinner"></div>

      <div class="state working" id="already" hidden></div>

      <!-- シフト表に予定がある -->
      <div id="vPlan" hidden>
        <div class="shift" id="planBox"></div>
        <p class="q">この内容で出勤しますか？</p>
        <div class="yn"><button id="yes">はい</button><button class="no" id="no">いいえ</button></div>
      </div>

      <!-- シフトを選ぶ -->
      <div id="vPick" hidden>
        <p class="q" id="pickQ">今日のシフトを選んでください</p>
        <div class="pick" id="pick"></div>
        <button id="pickGo" disabled>シフトを選んでください</button>
      </div>

      <!-- 同じ日にもう出勤しているとき -->
      <div class="choices" id="choices" hidden>
        <button id="cKeep"></button>
        <button id="cReplace"></button>
      </div>
    </div>

    <!-- 残業 -->
    <div id="vOt" hidden>
      <div id="otNone" class="empty" hidden>残業を付ける出勤の記録がありません。</div>
      <div id="otBody" hidden>
        <div class="target" id="otTarget"></div>
        <div class="label" id="otLabel">残業時間（30分単位）</div>
        <div class="stepper"><button id="otMinus">−</button><div class="v" id="otVal">なし</div><button id="otPlus">＋</button></div>
        <div class="preview2" id="otPreview"></div>
        <button id="otSave">残業を記録する</button>
        <p class="note">0にすると残業なしに戻せます。次に出勤するまで、何度でも直せます。</p>
      </div>
    </div>

    <!-- 確認 -->
    <div id="vList" hidden>
      <div class="list" id="list"><div class="empty">読み込み中…</div></div>
    </div>

    <div class="status" id="status"></div>
    <button class="sub" id="close">閉じる</button>
    <div class="ver">kintai 2026-11-08a</div>
  </div>

<script>
  // ===== 設定（config.js から読む） =====
  const CONFIG = window.APP_CONFIG || {};
  const LIFF_ID = (CONFIG.LIFF || {}).kintai || '';
  const GAS_URL = CONFIG.GAS_URL || '';
  // ================

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const yen = (n) => Number(n).toLocaleString('ja-JP') + '円';
  const otText = (m) => { const h = Math.floor(m / 60), r = m % 60; return m ? (h ? h + '時間' : '') + (r ? r + '分' : '') : 'なし'; };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const setStatus = (text, cls) => { $('status').textContent = text || ''; $('status').className = 'status ' + (cls || ''); };

  let st = null;           // kintai_status の結果
  let pickCode = '';       // 選んだシフト
  let otMin = 0;           // 入力中の残業（分）
  let tab = 'in';

  function tick() {
    const d = new Date();
    $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('date').textContent = d.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
  }

  async function api(payload) {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ idToken: liff.getIDToken() }, payload))
    });
    return res.json();
  }
  const shiftOf = (c) => st.shifts.find((s) => s.code === c);

  // ===== タブ =====
  function selectTab(t) {
    tab = t;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
    $('vIn').hidden = t !== 'in'; $('vOt').hidden = t !== 'ot'; $('vList').hidden = t !== 'list';
    setStatus('');
    if (t === 'ot') renderOt();
    if (t === 'list') loadList();
  }

  // ===== 出勤 =====
  function renderIn() {
    $('spinner').hidden = true;
    ['vPlan', 'vPick', 'choices'].forEach((id) => ($(id).hidden = true));
    if (st.today) {
      const s = st.today.shift ? shiftOf(st.today.shift) : null;
      $('already').hidden = false;
      $('already').innerHTML = '<b>今日は ' + st.today.time + ' に出勤済みです</b><small>' + (s ? s.code + ' ' + s.time + '・' + yen(s.pay) : 'シフトなし') + '</small>';
      openPick('出勤をやり直すときは、シフトを選んでください');
      return;
    }
    $('already').hidden = true;
    const p = st.plan ? shiftOf(st.plan) : null;
    if (p) {
      $('planBox').innerHTML = '';
      const big = el('div', 'big', p.code); big.append(el('span', '', p.time));
      const dl = el('dl');
      dl.append(el('dt', '', '予定の終了'), el('dd', '', p.end), el('dt', '', '給料'), el('dd', '', yen(p.pay)));
      $('planBox').append(big, dl);
      $('vPlan').hidden = false;
    } else {
      openPick('今日のシフトを選んでください');
    }
  }
  function openPick(q) {
    $('vPlan').hidden = true; $('choices').hidden = true;
    $('pickQ').textContent = q;
    pickCode = '';
    renderPick();
    $('vPick').hidden = false;
  }
  function renderPick() {
    $('pick').replaceChildren(...st.shifts.map((s) => {
      const b = el('button', pickCode === s.code ? 'on' : '');
      const mid = el('span', '', s.time); mid.append(el('small', '', '予定の終了 ' + s.end));
      b.append(el('b', 'k', s.code), mid, el('span', '', yen(s.pay)));
      b.addEventListener('click', () => { pickCode = s.code; renderPick(); });
      return b;
    }));
    $('pickGo').disabled = !pickCode;
    $('pickGo').textContent = pickCode ? pickCode + ' で出勤する' : 'シフトを選んでください';
  }

  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('この端末では位置情報が使えません。'));
      navigator.geolocation.getCurrentPosition(resolve, (err) => {
        const msg = {
          1: '位置情報の利用が許可されていません。\nスマホの設定で LINE の位置情報を「許可」にしてください。',
          2: '現在地を取得できませんでした。電波のよい場所でもう一度お試しください。',
          3: '現在地の取得に時間がかかっています。もう一度お試しください。'
        }[err.code] || '現在地を取得できませんでした。';
        reject(new Error(msg));
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }

  let lastPos = null, lastCode = '';
  async function checkin(code, mode) {
    const btns = document.querySelectorAll('button');
    btns.forEach((b) => (b.disabled = true));
    try {
      if (!mode) { setStatus('現在地を確認しています…'); lastPos = await getPosition(); lastCode = code; }
      setStatus('記録しています…');
      const r = await api({ action: 'liff_checkin', shift: lastCode, mode: mode || '',
        lat: lastPos.coords.latitude, lng: lastPos.coords.longitude, accuracy: lastPos.coords.accuracy });
      if (r.duplicate) {
        setStatus(r.message);
        $('vPlan').hidden = true; $('vPick').hidden = true; $('already').hidden = true;
        $('cKeep').innerHTML = 'そのままにする<small>' + r.prev + ' の出勤のまま</small>';
        $('cReplace').innerHTML = lastCode + ' で出勤し直す<small>今の時刻で記録し直します（残業は0に戻ります）</small>';
        $('choices').hidden = false;
        return;
      }
      done(r);
    } catch (e) {
      setStatus(e.message || '通信に失敗しました。もう一度お試しください。', 'ng');
    } finally {
      btns.forEach((b) => (b.disabled = false));
      if (!$('vPick').hidden) renderPick();
    }
  }

  // 記録できたら：トークに残してページを閉じる
  async function done(r) {
    setStatus(r.message || '記録しました。', r.ok ? 'ok' : 'ng');
    if (!r.ok) return;
    ['vPlan', 'vPick', 'choices', 'already', 'otBody'].forEach((id) => ($(id).hidden = true));
    $('tabs').hidden = true;
    if (liff.isInClient()) {
      try { if (r.chat) await liff.sendMessages([{ type: 'text', text: r.chat }]); } catch (e) { console.warn(e); }
      setTimeout(() => liff.closeWindow(), 1500);
    }
  }

  // ===== 残業 =====
  function renderOt() {
    const t = st && st.target;
    $('otNone').hidden = !!t; $('otBody').hidden = !t;
    if (!t) return;
    $('otTarget').innerHTML = '対象の勤務<br><b>' + t.label + '</b><br>次に出勤するまで入力・修正できます';
    $('otLabel').textContent = '残業時間（' + st.otUnit + '分単位）';
    otMin = t.ot || 0;
    paintOt();
  }
  function paintOt() {
    const t = st.target;
    $('otVal').textContent = otText(otMin);
    const end = (t.endBase + otMin) % (24 * 60);
    $('otPreview').innerHTML = '終了 <b>' + Math.floor(end / 60) + ':' + pad(end % 60) + '</b>　残業代 <b>' + yen(Math.round(otMin / 60 * st.otHourly)) +
      '</b>　給料 <b>' + yen(t.pay + Math.round(otMin / 60 * st.otHourly)) + '</b>';
    $('otMinus').disabled = otMin <= 0;
    $('otPlus').disabled = otMin >= st.otMax;
    $('otSave').textContent = otMin === (t.ot || 0) ? (otMin ? 'この残業で記録する' : '残業なしで記録する') : '残業を記録する';
  }
  async function saveOt() {
    $('otSave').disabled = true;
    setStatus('記録しています…');
    try {
      const r = await api({ action: 'kintai_overtime', minutes: otMin });
      if (r.ok && r.target) st.target = r.target;
      done(r);
    } catch (e) { setStatus('通信に失敗しました。もう一度お試しください。', 'ng'); }
    finally { $('otSave').disabled = false; }
  }

  // ===== 確認 =====
  async function loadList() {
    $('list').replaceChildren(el('div', 'empty', '読み込み中…'));
    try {
      const r = await api({ action: 'kintai_list' });
      if (!r.ok) { $('list').replaceChildren(el('div', 'empty', r.message)); return; }
      if (!r.list.length) { $('list').replaceChildren(el('div', 'empty', r.days + '日以内の勤務はありません。')); return; }
      const box = $('list'); box.replaceChildren();
      let day = '';
      r.list.forEach((w) => {
        if (w.day !== day) { day = w.day; box.append(el('div', 'day', day)); }
        const row = el('div', 'r');
        const p = w.pay;
        const tag = p.status === 'paid' ? el('span', 'tag paid', '支払済 ' + yen(p.amount))
          : p.status === 'unpaid' ? el('span', 'tag unpaid', '未払い ' + yen(p.amount)) : el('span', 'tag unknown', 'シフト未入力');
        row.append(el('span', 'sh ' + (w.shift || ''), w.shift || '—'), el('span', 'nm', w.name + (w.self ? '（自分）' : '')), tag,
          el('span', 'det', w.time + (w.ot ? '・残業' + w.ot : '')));
        box.append(row);
      });
      box.append(el('div', 'empty', r.days + '日前まで'));
    } catch (e) { $('list').replaceChildren(el('div', 'empty', '読み込みに失敗しました。')); }
  }

  // ===== ボタン =====
  document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => selectTab(b.dataset.tab)));
  $('yes').addEventListener('click', () => checkin(st.plan, ''));
  $('no').addEventListener('click', () => openPick('今日のシフトを選んでください'));
  $('pickGo').addEventListener('click', () => { if (pickCode) checkin(pickCode, ''); });
  $('cKeep').addEventListener('click', () => checkin(lastCode, 'keep'));
  $('cReplace').addEventListener('click', () => checkin(lastCode, 'replace'));
  $('otMinus').addEventListener('click', () => { otMin = Math.max(0, otMin - st.otUnit); paintOt(); });
  $('otPlus').addEventListener('click', () => { otMin = Math.min(st.otMax, otMin + st.otUnit); paintOt(); });
  $('otSave').addEventListener('click', saveOt);
  $('close').addEventListener('click', () => { if (liff.isInClient()) liff.closeWindow(); else window.close(); });

  async function main() {
    tick(); setInterval(tick, 10000);
    try {
      if (!/^\d+-\w+$/.test(LIFF_ID) || !/^https:\/\//.test(GAS_URL)) throw new Error('config');
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      const r = await api({ action: 'kintai_status' });
      if (!r.ok) { $('spinner').hidden = true; setStatus(r.message, 'ng'); return; }
      st = r;
      renderIn();
    } catch (e) {
      $('spinner').hidden = true;
      setStatus(e && e.message === 'config'
        ? 'config.js が読み込めないか、設定が入っていません。\n管理者に連絡してください。'
        : 'ページの準備に失敗しました。\nLINEのトーク画面から開き直してください。', 'ng');
    }
  }
  main();
</script>
</body>
</html>
